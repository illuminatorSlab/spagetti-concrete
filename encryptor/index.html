<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>意大利面·42号混凝土 — 加密解密工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#1c1c1e;color:#e4e4e6;min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:flex-start;padding:0;
}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.header{
  background:linear-gradient(135deg,#2a2a2d 0%,#1f1f21 100%);
  padding:20px 20px 16px;text-align:center;
  border-bottom:3px solid;
  border-image:linear-gradient(90deg,#009246 0%,#fff 50%,#ce2b37 100%) 1;
}
.header .icon{font-size:36px;margin-bottom:4px;letter-spacing:2px}
.header h1{font-size:22px;font-weight:700;letter-spacing:1px;line-height:1.3}
.header h1 .green{color:#009246}
.header h1 .red{color:#ce2b37}
.header .sub{font-size:12px;color:#888;margin-top:4px;letter-spacing:2px}

/* Codebook bar */
.codebook-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:#252528;font-size:13px;
  cursor:pointer;user-select:none;border-bottom:1px solid #333;
}
.codebook-bar .label{color:#aaa;display:flex;align-items:center;gap:6px}
.codebook-bar .count{background:#333;color:#009246;padding:2px 10px;border-radius:10px;font-weight:700;font-size:12px}
.codebook-bar .arrow{transition:transform .25s;font-size:11px;color:#666}
.codebook-bar.expanded .arrow{transform:rotate(180deg)}

/* Codebook panel */
.codebook-panel{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
  background:#1f1f21;border-bottom:1px solid #333;
}
.codebook-panel.show{max-height:400px;overflow-y:auto}
.codebook-panel .inner{padding:14px 20px}
.codebook-panel .passage{
  font-size:14px;line-height:1.8;color:#999;
  padding:10px 14px;background:#252528;border-radius:10px;
  border-left:3px solid #333;margin-bottom:12px
}
.codebook-panel .tokens-title{font-size:12px;color:#666;margin-bottom:8px}
.codebook-panel .tokens{
  display:flex;flex-wrap:wrap;gap:6px;
}
.codebook-panel .token-chip{
  font-size:12px;padding:3px 10px;background:#2a2a2d;
  border-radius:6px;color:#bbb;border:1px solid #333;
  font-family:monospace;
}
.codebook-panel .token-chip .idx{color:#666;margin-right:4px}

/* Main content */
.main{flex:1;display:flex;flex-direction:column;padding:0}

/* Sections */
.section{padding:14px 20px;border-bottom:1px solid #222}
.section:last-child{border-bottom:none}

/* Input */
.textarea-wrap{position:relative;flex-shrink:0;margin-bottom:12px}
.textarea-wrap textarea{
  width:100%;height:120px;padding:12px;font-size:14px;line-height:1.6;
  background:#252528;color:#e4e4e6;border:1.5px solid #333;
  border-radius:12px;resize:none;outline:none;transition:border-color .2s;
  font-family:inherit;
}
.textarea-wrap textarea:focus{border-color:#555}
.textarea-wrap textarea::placeholder{color:#555}
.textarea-wrap .char-count{
  position:absolute;bottom:10px;right:12px;font-size:11px;color:#555;
}

/* Buttons */
.actions{display:flex;gap:10px;flex-shrink:0;margin-bottom:14px}
.btn{
  flex:1;padding:12px 0;font-size:15px;font-weight:700;border:none;
  border-radius:12px;cursor:pointer;letter-spacing:0.5px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-encrypt{background:#009246;color:#fff}
.btn-encrypt:active{background:#007a3a;transform:scale(.97)}
.btn-decrypt{background:#ce2b37;color:#fff}
.btn-decrypt:active{background:#b8222e;transform:scale(.97)}
.btn-copy{
  flex:0 0 auto;padding:12px 18px;background:#333;color:#aaa;
  font-size:13px;font-weight:600
}
.btn-copy:active{background:#444}
.btn:disabled{opacity:.4;pointer-events:none}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:#333;color:#e4e4e6;padding:10px 24px;border-radius:20px;
  font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;
  z-index:99;
}
.toast.show{opacity:1}

/* Token management */
.token-mgmt{margin-top:12px}
.token-mgmt .hint{font-size:11px;color:#555;margin-bottom:10px;line-height:1.5}
.token-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.token-row input{flex:1;padding:8px 12px;font-size:13px;background:#1f1f21;color:#e4e4e6;border:1.5px solid #333;border-radius:8px;outline:none;font-family:inherit;min-width:0}
.token-row input:focus{border-color:#555}
.token-row .del-btn{flex:0 0 auto;width:32px;height:32px;border:none;border-radius:8px;background:#3a1a1a;color:#ce2b37;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.token-row .del-btn:active{background:#5a1a1a}
.token-row .idx-label{flex:0 0 auto;width:24px;text-align:right;font-size:11px;color:#555;font-family:monospace}
.token-add{display:flex;gap:6px;margin-top:8px}
.token-add input{flex:1;padding:8px 12px;font-size:13px;background:#1f1f21;color:#e4e4e6;border:1.5px solid #333;border-radius:8px;outline:none;font-family:inherit}
.token-add input:focus{border-color:#009246}
.token-add button{flex:0 0 auto;padding:8px 16px;background:#1a3a2a;color:#009246;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.token-add button:active{background:#2a5a3a}
.token-status{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px}
.token-status .dot{width:8px;height:8px;border-radius:50%}
.token-status .dot.ok{background:#009246}
.token-status .dot.warn{background:#ce2b37}
.token-status .txt{color:#888}
.token-status .count-num{font-weight:700}
.reset-btn{margin-top:8px;padding:6px 14px;font-size:11px;background:#252528;color:#666;border:1px solid #333;border-radius:6px;cursor:pointer;transition:all .15s}
.reset-btn:active{background:#333;color:#999}

/* I/O labels */
.io-label{font-size:13px;font-weight:700;letter-spacing:0.5px;margin-bottom:8px;padding:0 2px}
.plain-label{color:#009246}
.cipher-label{color:#ce2b37}
.flow-arrow{text-align:center;font-size:14px;color:#444;margin:6px 0;line-height:1;user-select:none}
.btn-wide{width:100%;margin-bottom:0}
.sep{height:1px;background:#222;margin:14px 0}
.btn-copy-cipher{flex:0 0 auto;padding:12px 18px;background:#333;color:#aaa;font-size:13px;font-weight:600}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#444;border-radius:2px}

@media(max-width:360px){
  .header{padding:16px 14px 12px}
  .header h1{font-size:19px}
  .section{padding:10px 14px}
  .textarea-wrap textarea{height:96px;font-size:13px}
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="icon">🏗️</div>
    <h1>
      <span class="green">意大利面</span>
      <span>·</span>
      <span class="red">42号混凝土</span>
    </h1>
    <div class="sub">知 识 搅 拌 机 · 加 密 解 密</div>
  </div>

  <!-- Codebook bar -->
  <div class="codebook-bar" id="codebookBar" onclick="toggleCodebook()">
    <span class="label">📖 编码本</span>
    <span style="display:flex;align-items:center;gap:8px">
      <span class="count" id="tokenCount">0</span>
      <span class="arrow" id="codebookArrow">▾</span>
    </span>
  </div>

  <!-- Codebook panel -->
  <div class="codebook-panel" id="codebookPanel">
    <div class="inner">
      <div class="passage" id="passageText"></div>
      <div class="token-mgmt" id="tokenMgmt">
        <div class="hint">⚠ 修改令牌后，之前加密的密文将无法解密。</div>
        <div id="tokenRows"></div>
        <div class="token-add">
          <input id="newTokenInput" placeholder="输入新令牌（≥2字）…" onkeydown="if(event.key==='Enter')addToken()">
          <button onclick="addToken()">+ 添加</button>
        </div>
        <div class="token-status" id="tokenStatus">
          <span class="dot" id="statusDot"></span>
          <span class="txt">令牌数：<span class="count-num" id="liveTokenCount">0</span>（最少 16 个）</span>
        </div>
        <button class="reset-btn" onclick="resetTokens()">↻ 重置为预设令牌</button>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main">

    <div class="section">
      <div class="io-label plain-label">🔒 明文</div>
      <div class="textarea-wrap">
        <textarea id="plainInput" placeholder="输入要加密的文本…" oninput="updatePlainCount()"></textarea>
        <span class="char-count" id="plainCount">0</span>
      </div>

      <div class="flow-arrow">⬇</div>
      <button class="btn btn-encrypt btn-wide" onclick="doEncrypt()">加密</button>

      <div class="sep"></div>

      <div class="io-label cipher-label">🔓 密文</div>
      <div class="textarea-wrap">
        <textarea id="cipherInput" placeholder="粘贴密文…" oninput="updateCipherCount()"></textarea>
        <span class="char-count" id="cipherCount">0</span>
      </div>

      <div class="flow-arrow">⬆</div>
      <div class="actions">
        <button class="btn btn-decrypt" onclick="doDecrypt()">解密</button>
        <button class="btn btn-copy btn-copy-cipher" onclick="copyCipher()">📋 复制密文</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// 编码本
// ─────────────────────────────────────────────

const PASSAGE = "我个人认为这个意大利面就应该拌42号混凝土，因为这个螺丝钉的长度，它很容易会直接影响到挖掘机的扭矩，你知道吧？你往里砸的时候，一瞬间它就会产生大量的高能蛋白，俗称UFO，会严重影响经济的发展，甚至对这个太平洋以及充电器都会造成一定的核、核、核污染，你知道吧，啊↑！再者说，根据这个勾股定理，你可以很容易地推断出，人工饲养的东条英鸡，它是可以捕获野生的三角函数的，所以说这个这个这个这个，你不管秦始皇的切面是否具有放射性，特朗普的N次方是否含有沉淀物，都不影响，这个这个沃尔玛跟这个维尔康在南极汇合，啊";

// 预设令牌（用户可编辑管理）
const PRESET_TOKENS = [
  '意大利面', '应该拌', '42号混凝土', '螺丝钉长度', '挖掘机扭矩',
  '你知道吧', '一瞬间', '高能蛋白', '俗称UFO', '经济发展',
  '太平洋', '充电器', '核污染', '勾股定理', '东条英鸡',
  '人工饲养', '三角函数', '秦始皇切面', '放射性', 'N次方沉淀物',
  '南极汇合'
];

// 运行时码本
let codebook = [...PRESET_TOKENS];

// ─────────────────────────────────────────────
// 令牌管理
// ─────────────────────────────────────────────

function validateToken(t) {
  const trimmed = t.trim();
  if (!trimmed) return '令牌不能为空';
  if ([...trimmed].length < 2) return '令牌至少需要 2 个字符';
  if (/[\p{P}\p{Z}\s]/u.test(trimmed)) return '令牌不能包含标点或空格';
  return null;
}

function checkComposable(list) {
  const s = new Set(list);
  for (let i = 0; i < list.length; i++) {
    for (let j = 0; j < list.length; j++) {
      const concat = list[i] + list[j];
      if (s.has(concat) && concat !== list[i] && concat !== list[j]) {
        return concat;
      }
    }
  }
  return null;
}

function addToken() {
  const input = document.getElementById('newTokenInput');
  const raw = input.value.trim();
  const err = validateToken(raw);
  if (err) { showToast(err); return; }
  if (codebook.includes(raw)) { showToast('令牌已存在'); return; }
  const testList = [...codebook, raw];
  const conflict = checkComposable(testList);
  if (conflict) { showToast('添加后产生拼接歧义：' + conflict); return; }
  codebook = testList;
  input.value = '';
  renderTokens();
  updateTokenStatus();
  showToast('已添加 \u2713');
}

function removeToken(idx) {
  const newList = codebook.filter((_, i) => i !== idx);
  const conflict = checkComposable(newList);
  if (conflict) { showToast('删除后产生拼接歧义：' + conflict + '，请先删除相关令牌'); return; }
  codebook = newList;
  renderTokens();
  updateTokenStatus();
  showToast('已删除 \u2713');
}

function updateToken(idx) {
  const input = document.getElementById('tokenInput' + idx);
  if (!input) return;
  const raw = input.value.trim();
  const err = validateToken(raw);
  if (err) { input.value = codebook[idx]; showToast(err); return; }
  const others = codebook.filter((_, i) => i !== idx);
  if (others.includes(raw)) { input.value = codebook[idx]; showToast('令牌已存在'); return; }
  const testList = [...others, raw];
  const conflict = checkComposable(testList);
  if (conflict) { input.value = codebook[idx]; showToast('修改后产生拼接歧义：' + conflict); return; }
  codebook = testList;
  renderTokens();
  updateTokenStatus();
  showToast('已更新 \u2713');
}

function resetTokens() {
  codebook = [...PRESET_TOKENS];
  renderTokens();
  updateTokenStatus();
  showToast('已重置为预设令牌 \u2713');
}

function renderTokens() {
  const container = document.getElementById('tokenRows');
  container.innerHTML = codebook.map((token, idx) => {
    const esc = token.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    return '<div class="token-row">' +
      '<span class="idx-label">' + idx + '</span>' +
      '<input id="tokenInput' + idx + '" value="' + esc + '" onchange="updateToken(' + idx + ')" onblur="updateToken(' + idx + ')">' +
      '<button class="del-btn" onclick="removeToken(' + idx + ')" title="\u5220\u9664">\u2715</button>' +
      '</div>';
  }).join('');
}

function updateTokenStatus() {
  const count = codebook.length;
  document.getElementById('liveTokenCount').textContent = count;
  document.getElementById('tokenCount').textContent = count + ' 个令牌';
  const dot = document.getElementById('statusDot');
  dot.className = 'dot ' + (count >= 16 ? 'ok' : 'warn');
}

// ─────────────────────────────────────────────
// 加密
// ─────────────────────────────────────────────

function encrypt(text) {
  if (!text) return '';
  const N = codebook.length;
  if (N < 16) throw new Error('码本令牌不足 16 个，无法加密');
  const bytes = new TextEncoder().encode(text);
  const parts = [];
  for (const b of bytes) {
    const i = Math.floor(b / N);
    const j = b % N;
    parts.push(codebook[i] + codebook[j]);
  }
  return parts.join('');
}

// ─────────────────────────────────────────────
// 解密：最长匹配贪婪分词
// ─────────────────────────────────────────────

function tokenizeByCodebook(encoded) {
  const sorted = [...codebook].sort((a, b) => b.length - a.length);
  const tokens = [];
  let pos = 0;
  while (pos < encoded.length) {
    let matched = false;
    for (const token of sorted) {
      if (encoded.startsWith(token, pos)) {
        tokens.push(token);
        pos += token.length;
        matched = true;
        break;
      }
    }
    if (!matched) {
      throw new Error('在位置 ' + pos + ' 无法识别字符 "' + encoded[pos] + '"，密文可能被篡改');
    }
  }
  return tokens;
}

function decrypt(encoded) {
  if (!encoded) return '';
  const N = codebook.length;
  const tokens = tokenizeByCodebook(encoded);
  if (tokens.length % 2 !== 0) {
    throw new Error('密文令牌数为奇数 (' + tokens.length + ')，密文可能不完整');
  }
  const bytes = [];
  for (let k = 0; k < tokens.length; k += 2) {
    const i = codebook.indexOf(tokens[k]);
    const j = codebook.indexOf(tokens[k + 1]);
    if (i === -1 || j === -1) {
      throw new Error('令牌 "' + tokens[k] + '" 或 "' + tokens[k + 1] + '" 不在码本中');
    }
    bytes.push(i * N + j);
  }
  return new TextDecoder().decode(new Uint8Array(bytes));
}

// ─────────────────────────────────────────────
// UI
// ─────────────────────────────────────────────

function updatePlainCount() {
  document.getElementById('plainCount').textContent =
    document.getElementById('plainInput').value.length;
}

function updateCipherCount() {
  document.getElementById('cipherCount').textContent =
    document.getElementById('cipherInput').value.length;
}

function doEncrypt() {
  const input = document.getElementById('plainInput').value;
  const out = document.getElementById('cipherInput');
  if (!input) { out.value = ''; return; }
  try {
    out.value = encrypt(input);
    updateCipherCount();
  } catch (e) {
    showToast('加密失败：' + e.message);
  }
}

function doDecrypt() {
  const input = document.getElementById('cipherInput').value;
  const out = document.getElementById('plainInput');
  if (!input) { out.value = ''; return; }
  try {
    out.value = decrypt(input);
    updatePlainCount();
  } catch (e) {
    showToast('解密失败：' + e.message);
  }
}

function copyCipher() {
  const text = document.getElementById('cipherInput').value;
  if (!text) return showToast('没有可复制的内容');
  navigator.clipboard.writeText(text).then(
    () => showToast('已复制到剪贴板 \u2713'),
    () => showToast('复制失败')
  );
}

function toggleCodebook() {
  const bar = document.getElementById('codebookBar');
  const panel = document.getElementById('codebookPanel');
  bar.classList.toggle('expanded');
  panel.classList.toggle('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

// ─────────────────────────────────────────────
// 初始化
// ─────────────────────────────────────────────

function init() {
  // 显示原文段
  document.getElementById('passageText').textContent = PASSAGE;

  // 渲染令牌管理与状态
  renderTokens();
  updateTokenStatus();

  // 自测：加解密往返
  (function selfTest() {
    const testCases = [
      '你好世界',
      'Hello 意大利面 🍝',
      '42号混凝土',
      'UFO',
      'abc123测试文字@#$%',
    ];
    let failures = 0;
    for (const tc of testCases) {
      try {
        const enc = encrypt(tc);
        const dec = decrypt(enc);
        if (dec !== tc) {
          console.error('自测失败:', { input: tc, encrypted: enc, decrypted: dec });
          failures++;
        }
      } catch (e) {
        console.error('自测异常:', tc, e);
        failures++;
      }
    }
    if (failures === 0) {
      console.log('✅ 自测通过：所有测试用例加解密往返正确');
    } else {
      console.warn(`⚠️ 自测：${failures}/${testCases.length} 个用例失败`);
    }
  })();

  // 绑定回车键
  document.getElementById('plainInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doEncrypt(); }
  });
  document.getElementById('cipherInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doDecrypt(); }
  });
}

init();
</script>
</body>
</html>
