<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>抛硬币卜卦</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#1c1c1e;color:#e4e4e6;min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}

.header{text-align:center;padding:14px 16px 0;flex-shrink:0}
.header h1{font-size:18px;font-weight:700;color:#c0a030}
.header .sub{font-size:11px;color:#555;margin-top:2px}

.tabs{display:flex;gap:0;padding:12px 16px 0;flex-shrink:0}
.tab{
  flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:600;
  color:#666;background:#252528;border:1.5px solid #333;cursor:pointer;
  transition:all .2s
}
.tab:first-child{border-radius:10px 0 0 10px}
.tab:last-child{border-radius:0 10px 10px 0}
.tab.active{color:#1c1c1e;background:#c0a030;border-color:#c0a030;position:relative;z-index:1}
.tab:not(.active):hover{color:#999}

.canvas-wrap{flex:1;position:relative;margin:0 12px;border-radius:14px;overflow:hidden;background:#0a0a0c}
.canvas-wrap canvas{display:block;width:100%!important;height:100%!important}

.overlay{
  position:absolute;bottom:0;left:0;right:0;
  padding:16px;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:10px
}
.overlay>*{pointer-events:auto}

.result-panel{
  position:absolute;left:6px;bottom:120px;
  width:calc(50% - 12px);
  display:flex;flex-direction:column;align-items:center;gap:4px
}
.result-bar{
  background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  padding:10px 12px;font-size:14px;text-align:center;transition:background .3s;width:100%
}
.result-bar .coins{font-size:22px;letter-spacing:6px;margin-bottom:2px}
.result-bar .label{font-size:12px;color:#888}

.hexagram-display{
  display:none;position:absolute;right:6px;bottom:120px;
  z-index:5;overflow-y:auto;max-height:35vh;width:calc(50% - 12px);
  flex-direction:column;align-items:center;gap:6px;
  background:transparent;pointer-events:none
}
.hexagram-display.show{display:flex}
.hexagram-display.complete{
  top:0;left:0;right:0;bottom:0;width:auto;
  max-height:none;padding:16px 16px 90px;
  background:rgba(14,14,18,.94);pointer-events:auto
}
.hexagram-lines{
  display:flex;flex-direction:column-reverse;gap:6px;
  padding:12px;background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  transition:background .3s;width:100%;max-width:360px
}
.hexagram-lines.complete{
  background:rgba(30,30,34,.92);border-color:#333
}
.hexagram-line{display:flex;align-items:center;gap:10px;opacity:.25}
.hexagram-line.filled{opacity:1}
.hexagram-line .idx{font-size:11px;color:#555;width:28px;text-align:right;flex-shrink:0}
.hexagram-line .bar{
  flex:1;height:14px;border-radius:7px;background:#c0a030;position:relative
}
.hexagram-line.yin .bar{
  background:transparent;display:flex;gap:6px;justify-content:center
}
.hexagram-line.yin .bar::before,.hexagram-line.yin .bar::after{
  content:'';width:40%;height:100%;background:#c0a030;border-radius:7px
}
.hexagram-line.changing .idx{color:#ce2b37;font-weight:700}
.hexagram-line.changing .bar,
.hexagram-line.changing.yin .bar::before,
.hexagram-line.changing.yin .bar::after{background:#ce2b37}
.hexagram-line .dot{
  width:8px;height:8px;border-radius:50%;background:#ce2b37;flex-shrink:0;
  display:none
}
.hexagram-line.changing .dot{display:block}

.hexagram-result{
  display:none;margin-top:10px;text-align:center;font-size:13px;color:#c0a030;
  background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  padding:10px;transition:background .3s;width:100%;max-width:360px
}
.hexagram-result.complete{
  display:block;background:rgba(30,30,34,.92);border-color:#333
}
.hexagram-result .gua-name{font-size:24px;font-weight:700;margin-bottom:2px}
.hexagram-result .gua-symbol{font-size:48px;margin-bottom:4px}
.hexagram-result .gua-detail{font-size:12px;color:#888;line-height:1.5;margin-top:4px}
.hexagram-result .gua-detail b{color:#c0a030}
.hexagram-result .changed-name{font-size:16px;color:#ce2b37;margin-top:6px}

.controls{
  display:flex;justify-content:center;gap:12px;
  padding:12px 16px;flex-shrink:0;position:relative;z-index:10
}
.btn{
  padding:12px 28px;border-radius:24px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;border:none;
  background:#c0a030;color:#1c1c1e;
  box-shadow:0 4px 15px rgba(192,160,48,.3)
}
.btn:active{transform:scale(.94)}
.btn:disabled{background:#333;color:#555;box-shadow:none;cursor:default}
.btn-secondary{background:#252528;color:#c0a030;border:1.5px solid #c0a030;box-shadow:none}
.btn-secondary:disabled{color:#555;border-color:#333}

.btn-copy{background:transparent;color:#c0a030;border:1px solid #c0a030;padding:6px 16px;border-radius:16px;font-size:12px;cursor:pointer;transition:all .2s}
.btn-copy:hover{background:rgba(192,160,48,.15)}

.gyro-badge{
  position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;
  background:#444;transition:background .3s;z-index:1
}
.gyro-badge.active{background:#4caf50}
.gyro-badge.denied{background:#ce2b37}

.permission-prompt{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,10,12,.9);z-index:2;border-radius:14px
}
.permission-prompt.hidden{display:none}
.hidden{display:none}
.permission-prompt .inner{text-align:center;padding:20px}
.permission-prompt .inner .icon{font-size:44px;margin-bottom:12px}
.permission-prompt .inner p{font-size:13px;color:#888;line-height:1.6;margin-bottom:16px}

.progress-text{
  font-size:12px;color:#555
}

.debug-panel{
  background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.15);border-radius:8px;
  padding:6px 10px;font-size:10px;font-family:monospace;color:#0f0;line-height:1.5;
  position:absolute;top:8px;left:8px;z-index:3;max-width:200px
}
.debug-panel b{color:#ff0}
.debug-panel .warn{color:#f44}
.debug-panel .ok{color:#0f0}

.footer{text-align:center;padding:8px 16px;flex-shrink:0}
.footer a{font-size:11px;color:#444;text-decoration:none}
.footer a:hover{color:#666}

/* LLM Settings */
.settings-btn{
  position:absolute;top:24px;right:24px;width:32px;height:32px;
  border-radius:50%;background:rgba(20,22,26,.65);border:1px solid rgba(255,255,255,.1);
  color:#888;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  z-index:1;transition:all .2s
}
.settings-btn:hover{color:#c0a030;border-color:#c0a030}

.settings-modal{
  position:absolute;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,10,12,.92);z-index:10;border-radius:14px
}
.settings-modal.hidden{display:none}
.settings-modal .inner{width:300px;padding:24px 20px;text-align:left}
.settings-modal .inner h3{font-size:16px;color:#c0a030;margin-bottom:16px;text-align:center}
.settings-modal label{display:block;font-size:11px;color:#666;margin-bottom:4px}
.settings-modal input{
  width:100%;padding:10px 12px;margin-bottom:12px;border-radius:8px;
  border:1px solid #333;background:#1c1c1e;color:#e4e4e6;font-size:13px;outline:0
}
.settings-modal input:focus{border-color:#c0a030}
.settings-modal .btn-row{display:flex;gap:10px;margin-top:4px}
.settings-modal .btn-row .btn{flex:1;padding:10px 0;font-size:13px}

/* Question input area */
.ask-section{
  margin-top:10px;padding:12px;
  background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  text-align:center;transition:background .3s;width:100%;max-width:360px
}
.ask-section.complete{background:rgba(30,30,34,.92);border-color:#333}
.ask-section .ask-label{font-size:14px;color:#c0a030;margin-bottom:8px}
.ask-section textarea{
  width:100%;padding:10px 12px;border-radius:8px;
  border:1px solid #333;background:#1c1c1e;color:#e4e4e6;font-size:13px;resize:vertical;
  min-height:48px;max-height:100px;outline:0;font-family:inherit
}
.ask-section textarea:focus{border-color:#c0a030}
.ask-section .btn-ask{
  margin-top:8px;padding:8px 24px;border-radius:16px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;background:#c0a030;color:#1c1c1e;transition:all .2s
}
.ask-section .btn-ask:disabled{background:#333;color:#555;cursor:default}
.ask-section .btn-ask:active:not(:disabled){transform:scale(.94)}

/* Interpretation result */
.interpretation-panel{
  margin-top:10px;padding:14px;
  background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  text-align:left;position:relative;transition:background .3s;width:100%;max-width:360px
}
.interpretation-panel.complete{background:rgba(30,30,34,.92);border-color:#333}
.interpretation-panel .interp-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.interpretation-panel .interp-header span{font-size:13px;color:#c0a030;font-weight:600}
.interpretation-panel .interp-body{
  font-size:14px;color:#d4d4d6;line-height:1.7;white-space:pre-wrap;word-break:break-word
}
.interpretation-panel .btn-copy-interp{
  background:transparent;color:#888;border:1px solid #444;padding:4px 12px;
  border-radius:12px;font-size:11px;cursor:pointer;transition:all .2s
}
.interpretation-panel .btn-copy-interp:hover{color:#c0a030;border-color:#c0a030}

/* History */
.history-section{
  margin-top:10px;
  background:rgba(20,22,26,.45);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  overflow:hidden;transition:background .3s;width:100%;max-width:360px
}
.history-section.complete{background:rgba(30,30,34,.92);border-color:#333}
.history-section .history-toggle{
  padding:10px 14px;font-size:12px;color:#888;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;user-select:none
}
.history-section .history-toggle:hover{color:#c0a030}
.history-section .history-toggle .arrow{transition:transform .2s;font-size:10px}
.history-section .history-toggle.open .arrow{transform:rotate(180deg)}
.history-section .history-list{display:none;padding:0 14px 10px}
.history-section .history-list.show{display:block}
.history-item{
  padding:8px 0;border-top:1px solid rgba(255,255,255,.06);cursor:pointer
}
.history-item .hi-time{font-size:10px;color:#555}
.history-item .hi-question{font-size:12px;color:#aaa;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .hi-body{display:none;font-size:12px;color:#ccc;line-height:1.5;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.history-item.expanded .hi-body{display:block}
.history-item .hi-delete{
  float:right;font-size:10px;color:#555;padding:2px 8px;border:1px solid #333;
  border-radius:8px;cursor:pointer;transition:all .2s
}
.history-item .hi-delete:hover{color:#ce2b37;border-color:#ce2b37}

@media(max-width:360px){
  .tabs{padding:10px 12px 0}
  .tab{font-size:12px;padding:8px 0}
  .header h1{font-size:16px}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>🪙 抛硬币卜卦</h1>
    <div class="sub">摇动手机抛掷硬币</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="hexagram">六爻卜卦</button>
    <button class="tab" data-mode="triple">三枚</button>
    <button class="tab" data-mode="single">单枚</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="gyro-badge" id="gyroBadge" title="陀螺仪状态"></div>
    <div class="settings-btn" id="settingsBtn" title="LLM 解卦设置">⚙</div>
    <div class="debug-panel" id="debugPanel">
      gyro:<span class="warn" id="dbGyro">---</span>
      mag:<b id="dbMag">--</b>
      rest:<b id="dbRest">--</b>
      r:<b id="dbRatio">--</b>
      ev:<b id="dbEv">0</b>
    </div>
    <div class="permission-prompt hidden" id="permPrompt">
      <div class="inner">
        <div class="icon" id="permIcon">📱</div>
        <p id="permText">需要陀螺仪权限来检测<br>手机的抛掷动作</p>
        <button class="btn" id="permBtn">启用陀螺仪</button>
        <button class="btn btn-secondary hidden" id="permRetryBtn">重试</button>
      </div>
    </div>
    <div class="settings-modal hidden" id="settingsModal">
      <div class="inner">
        <h3>⚙ LLM 解卦设置</h3>
        <label>API 地址</label>
        <input type="text" id="llmApi" placeholder="https://api.deepseek.com/v1/chat/completions">
        <label>API Key</label>
        <input type="password" id="llmKey" placeholder="sk-...">
        <label>模型名称</label>
        <input type="text" id="llmModel" placeholder="deepseek-v4-flash">
        <div class="btn-row">
          <button class="btn btn-secondary" id="settingsCancelBtn">取消</button>
          <button class="btn" id="settingsSaveBtn">保存</button>
        </div>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="progress-text" id="progressText"></div>
    <div class="result-bar" id="resultBar">
      <div class="coins" id="resultCoins"></div>
      <div class="label" id="resultLabel"></div>
    </div>
  </div>
  <div class="hexagram-display" id="hexagramDisplay">
    <div class="hexagram-lines" id="hexagramLines"></div>
    <div class="hexagram-result" id="hexagramResult"></div>
    <div class="ask-section hidden" id="askSection">
      <div class="ask-label">您所卜何事？</div>
      <textarea id="askInput" rows="2" placeholder="请输入您想问的事情..."></textarea>
      <button class="btn-ask" id="askBtn">🔮 解卦</button>
    </div>
    <div class="interpretation-panel hidden" id="interpPanel">
      <div class="interp-header">
        <span>🔮 AI 解卦</span>
        <button class="btn-copy-interp" id="copyInterpBtn">复制</button>
      </div>
      <div class="interp-body" id="interpBody"></div>
    </div>
    <div class="history-section hidden" id="historySection">
      <div class="history-toggle" id="historyToggle">
        历史解卦记录 <span class="arrow">▼</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="flipBtn">🖐 抛掷</button>
    <button class="btn btn-secondary" id="resetBtn" style="display:none">重新开始</button>
  </div>

  <div class="footer">
    <a href="../index.html">← 返回首页</a>
  </div>

</div>

<script src="lib/three.min.js"></script>
<script src="lib/cannon.min.js"></script>

// ========== LLM SETTINGS ==========
var LLM_STORAGE_KEY = 'iching_llm_settings';
var INTERP_STORAGE_KEY = 'iching_interpretations';

function loadLlmSettings() {
  var apiSet = false, keySet = false, modelSet = false;
  try {
    var raw = localStorage.getItem(LLM_STORAGE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s.api) { elLlmApi.value = s.api; apiSet = true; }
      if (s.key) { elLlmKey.value = s.key; keySet = true; }
      if (s.model) { elLlmModel.value = s.model; modelSet = true; }
    }
  } catch(e) {}
  if (!apiSet) elLlmApi.value = 'https://api.deepseek.com/v1/chat/completions';
  if (!modelSet) elLlmModel.value = 'deepseek-v4-flash';
}

function saveLlmSettings() {
  var s = {
    api: elLlmApi.value.trim(),
    key: elLlmKey.value.trim(),
    model: elLlmModel.value.trim()
  };
  try { localStorage.setItem(LLM_STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}

function updateSettingsSaveBtn() {
  var api = elLlmApi.value.trim();
  var key = elLlmKey.value.trim();
  var model = elLlmModel.value.trim();
  elSettingsSaveBtn.disabled = !(api && key && model);
}

elSettingsBtn.onclick = function() {
  elSettingsModal.classList.remove('hidden');
  updateSettingsSaveBtn();
};

elLlmApi.addEventListener('input', updateSettingsSaveBtn);
elLlmKey.addEventListener('input', updateSettingsSaveBtn);
elLlmModel.addEventListener('input', updateSettingsSaveBtn);

elSettingsCancelBtn.onclick = function() {
  elSettingsModal.classList.add('hidden');
};

elSettingsSaveBtn.onclick = function() {
  saveLlmSettings();
  elSettingsModal.classList.add('hidden');
  if (!elAskSection.classList.contains('hidden')) showAskSection();
};

// Close modal on background click
elSettingsModal.addEventListener('click', function(e) {
  if (e.target === elSettingsModal) {
    elSettingsModal.classList.add('hidden');
    if (!elAskSection.classList.contains('hidden')) showAskSection();
  }
});

// Arena / table
var TABLE_SIZE = 44;
var TABLE_Y = -1.8;
var WALL_HEIGHT = 6;
var PHYS_WALL_H = 8;  // physics walls taller to prevent coins flying out

function buildArena() {
  // Generate a felt-like texture with color variation
  var texCanvas = document.createElement('canvas');
  texCanvas.width = 512; texCanvas.height = 512;
  var ctx = texCanvas.getContext('2d');
  // Base dark green
  ctx.fillStyle = '#1a3a1a'; ctx.fillRect(0, 0, 512, 512);
  // Subtle noise/grain
  for (var i = 0; i < 8000; i++) {
    var x = Math.random() * 512, y = Math.random() * 512;
    var shade = 24 + Math.floor(Math.random() * 20);
    ctx.fillStyle = 'rgb(' + shade + ',' + (shade + 30) + ',' + shade + ')';
    ctx.fillRect(x, y, 2 + Math.random() * 3, 2 + Math.random() * 3);
  }
  // Subtle directional brush strokes
  ctx.strokeStyle = 'rgba(255,255,255,0.015)';
  ctx.lineWidth = 1;
  for (var j = 0; j < 60; j++) {
    ctx.beginPath();
    var sx = Math.random() * 512, sy = Math.random() * 512;
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + (Math.random() - 0.5) * 200, sy + (Math.random() - 0.5) * 200);
    ctx.stroke();
  }
  var feltTex = new THREE.CanvasTexture(texCanvas);
  feltTex.wrapS = THREE.RepeatWrapping;
  feltTex.wrapT = THREE.RepeatWrapping;
  feltTex.repeat.set(4, 4);

  var floorGeo = new THREE.PlaneGeometry(TABLE_SIZE * 2, TABLE_SIZE * 2);
  var floorMat = new THREE.MeshStandardMaterial({ map: feltTex, roughness: 0.85, metalness: 0.02, color: 0xccddcc });
  var floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.y = TABLE_Y;
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Table edge/rail — wooden base + glass panels
  var railMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.5, metalness: 0.15 });
  var glassMat = new THREE.MeshStandardMaterial({ color: 0xaaccdd, roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.25 });
  var halfX = TABLE_SIZE, halfZ = TABLE_SIZE;

  function addRail(x, z, w, d) {
    var geoRail = new THREE.BoxGeometry(w, 0.3, d);
    var rail = new THREE.Mesh(geoRail, railMat);
    rail.position.set(x, TABLE_Y + 0.15, z);
    scene.add(rail);
    var geoGlass = new THREE.BoxGeometry(w, WALL_HEIGHT, d);
    var glass = new THREE.Mesh(geoGlass, glassMat);
    glass.position.set(x, TABLE_Y + 0.3 + WALL_HEIGHT / 2, z);
    scene.add(glass);
  }

  addRail( halfX + 0.05, 0, 0.2, halfZ * 2 + 0.4);
  addRail(-halfX - 0.05, 0, 0.2, halfZ * 2 + 0.4);
  addRail(0,  halfZ + 0.05, halfX * 2 + 0.4, 0.2);
  addRail(0, -halfZ - 0.05, halfX * 2 + 0.4, 0.2);
}

buildArena();

function addPhysWall(x, z, w, h, d) {

// ========== COIN TEXTURES ==========
function createCoinFace(canvas, bgColor, rimColor, charText, charColor) {
  var ctx = canvas.getContext('2d');
  var cx = canvas.width / 2, cy = canvas.height / 2, r = canvas.width * 0.44;
  ctx.fillStyle = bgColor;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rimColor;
  ctx.lineWidth = r * 0.07;
  ctx.stroke();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = rimColor;
  ctx.lineWidth = r * 0.03;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = charColor;
  ctx.font = 'bold ' + (r * 1.2) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(charText, cx, cy * 0.98);
}

var texCanvas = document.createElement('canvas');
texCanvas.width = 256;
texCanvas.height = 256;
createCoinFace(texCanvas, '#e8d5a0', '#c0a030', '陽', '#8b6914');
var texHeads = new THREE.CanvasTexture(texCanvas);
texHeads.colorSpace = THREE.SRGBColorSpace;

var texCanvas2 = document.createElement('canvas');
texCanvas2.width = 256;
texCanvas2.height = 256;
createCoinFace(texCanvas2, '#4a4a4a', '#2a2a2a', '\u9670', '#1a1a1a');
var texTails = new THREE.CanvasTexture(texCanvas2);
texTails.colorSpace = THREE.SRGBColorSpace;

// ========== COIN MODEL ==========
var COIN_RADIUS = 0.85;
var COIN_HEIGHT = 0.12;
var COIN_HALF_H = COIN_HEIGHT / 2;
var COIN_REST_Y = TABLE_Y + COIN_HALF_H;
var COIN_SPAWN_H = COIN_REST_Y + 4;

function createCoinGeometry() {
  return new THREE.CylinderGeometry(COIN_RADIUS, COIN_RADIUS, COIN_HEIGHT, 64);
}

var headsMat = new THREE.MeshStandardMaterial({ map: texHeads, roughness: 0.5, metalness: 0.3 });
var tailsMat = new THREE.MeshStandardMaterial({ map: texTails, roughness: 0.5, metalness: 0.3 });
var edgeMat = new THREE.MeshStandardMaterial({ color: 0xb8860b, roughness: 0.35, metalness: 0.9 });
var multiMats = [edgeMat, headsMat, tailsMat];

var coinShape = new CANNON.Box(new CANNON.Vec3(COIN_RADIUS, COIN_HALF_H, COIN_RADIUS));

// ========== COIN STATE ==========
function createCoinState(xOffset) {
  var geo = createCoinGeometry();
  var mesh = new THREE.Mesh(geo, multiMats);
  mesh.position.set(xOffset, COIN_SPAWN_H, 0);
  mesh.rotation.set(Math.PI / 2, 0, 0);  // stand on edge
  scene.add(mesh);

  var body = new CANNON.Body({ mass: 0.005, material: coinMaterial });
  body.addShape(coinShape);
  body.position.set(xOffset, COIN_SPAWN_H, 0);
  body.quaternion.setFromEuler(Math.PI / 2, 0, 0);  // stand on edge
  body.sleepSpeedLimit = 0.1;
  body.sleepTimeLimit = 0.8;
  body.allowSleep = true;
  physWorld.addBody(body);

  return {
    mesh: mesh,
    body: body,
    ox: xOffset,
    oz: 0,
    settled: true,
    result: null,
  };
}

var coins = [];

function createCoins(count) {
  coins.forEach(function(c) {
    scene.remove(c.mesh);
    physWorld.removeBody(c.body);
  });
  coins = [];
  var offsets = count === 1 ? [0] : [-9, 0, 9];
  for (var i = 0; i < count; i++) {
    coins.push(createCoinState(offsets[i]));
  }
}

// Last shake data
var shakeAccX = 0, shakeAccY = 0, shakeAccZ = 0;
var shakeRotX = 0, shakeRotY = 0, shakeRotZ = 0;

function triggerFlip() {
  if (cooldown) return;
  cooldown = true;
  gyroArmed = false;
  elFlipBtn.disabled = true;
  clearTimeout(cooldownTimer);
  cooldownTimer = setTimeout(function() {
    cooldown = false;
    elFlipBtn.disabled = false;
  }, COOLDOWN_MS);

  coins.forEach(function(c) {
    c.body.position.set(c.ox, COIN_SPAWN_H, c.oz);
    c.body.quaternion.setFromEuler(Math.PI / 2, 0, 0);
    c.body.velocity.set(0, 0, 0);
    c.body.angularVelocity.set(
      shakeRotX * 6 + (Math.random() - 0.5) * 50,
      shakeRotY * 6 + (Math.random() - 0.5) * 50,
      shakeRotZ * 6 + (Math.random() - 0.5) * 50
    );
    c.body.wakeUp();
    c.settled = false;
    c.result = null;
  });
  settledHandled = false;

  if (navigator.vibrate) navigator.vibrate(15);
}

// ========== PHYSICS SYNC + SETTLE ==========
var SETTLE_FRAME_COUNT = 40;

function stepPhysics(dt) {
  physWorld.step(1 / 60, dt, 5);

  if (coins.length > 0) {
    var c0 = coins[0];
    elDbMag.textContent = 'bY:' + c0.body.position.y.toFixed(2);
    elDbRest.textContent = 'gY:' + TABLE_Y.toFixed(1);
  }

  coins.forEach(function(c) {
    if (!c.settled) {
      c.mesh.position.copy(c.body.position);
      c.mesh.quaternion.copy(c.body.quaternion);
    }

    if (c.settled) return;

    var v = c.body.velocity;
    var av = c.body.angularVelocity;
    var speed = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
    var aSpeed = Math.sqrt(av.x * av.x + av.y * av.y + av.z * av.z);

    if (speed < 0.1 && aSpeed < 0.3) {
      if (!c._settleFrames) c._settleFrames = 0;
      c._settleFrames++;
      if (c._settleFrames >= SETTLE_FRAME_COUNT) {
        c.settled = true;
        c.body.sleep();
        // Determine result from natural resting orientation (no snap)
        var topN = new THREE.Vector3(0, 1, 0);
        topN.applyQuaternion(c.mesh.quaternion);
        c.result = topN.y > 0 ? 'heads' : 'tails';
      }
    } else {
      c._settleFrames = 0;
    }
  });

  var activeCoins = coins.filter(function(c) { return !c.settled; });
  if (activeCoins.length === 0 && !settledHandled &&
      coins.some(function(c) { return c.result !== null; })) {
    settledHandled = true;
    onAllSettled();
  }
}


function onAllSettled() {
  var results = coins.map(function(c) { return c.result; });
  var headsCount = results.filter(function(r) { return r === 'heads'; }).length;

  updateResultBar(headsCount, results);

  if (mode === 'hexagram') {
    recordHexagramLine(headsCount);
  }
}

// ========== I CHING LOGIC ==========
var LINE_LABELS = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];

function getLineType(headsCount) {
  if (headsCount === 3) return 'laoyang';
  if (headsCount === 2) return 'shaoyin';
  if (headsCount === 1) return 'shaoyang';
  return 'laoyin';
}

function isYang(headsCount) {
  return headsCount === 3 || headsCount === 1;
}

function isChanging(headsCount) {
  return headsCount === 3 || headsCount === 0;
}

function recordHexagramLine(headsCount) {
  var lineType = getLineType(headsCount);
  hexagramLines[hexagramRound] = { headsCount: headsCount, lineType: lineType };
  hexagramRound++;

  updateHexagramProgress();

  if (hexagramRound >= 6) {
    showHexagramResult();
    elHexagramDisplay.classList.add('complete');
    elHexagramLines.classList.add('complete');
    elHexagramResult.classList.add('complete');
    gyroActive = false;
    elGyroBadge.classList.remove('active');
    elDbGyro.textContent = 'done';
    elFlipBtn.style.display = 'none';
    elResetBtn.style.display = '';
  }
}

function updateHexagramProgress() {
  elProgressText.textContent = '第 ' + hexagramRound + ' / 6 次';
  if (hexagramRound >= 6) elProgressText.textContent = '';

  var html = '';
  for (var i = 0; i < 6; i++) {
    if (i < hexagramLines.length) {
      var line = hexagramLines[i];
      var cls = isYang(line.headsCount) ? 'yang' : 'yin';
      if (isChanging(line.headsCount)) cls += ' changing';
      html += '<div class="hexagram-line filled ' + cls + '">';
      html += '<span class="idx">' + LINE_LABELS[i] + '</span>';
      html += '<span class="bar"></span>';
      html += '<span class="dot"></span>';
      html += '</div>';
    } else {
      html += '<div class="hexagram-line">';
      html += '<span class="idx">' + LINE_LABELS[i] + '</span>';
      html += '<span class="bar"></span>';
      html += '<span class="dot"></span>';
      html += '</div>';
    }
  }
  elHexagramLines.innerHTML = html;
  if (hexagramRound > 0) elHexagramDisplay.classList.add('show');
}

function calcHexagramIndexFromLines(lines) {
  var idx = 0;
  for (var i = 0; i < 6; i++) {
    if (i < lines.length && isYang(lines[i].headsCount)) {
      idx |= (1 << i);
    }
  }
  return idx;
}

function showHexagramResult() {
  var originalIdx = calcHexagramIndexFromLines(hexagramLines);
  var originalGua = HEXAGRAM_MAP[originalIdx];

  var hasChanging = hexagramLines.some(function(l) { return isChanging(l.headsCount); });
  var changedIdx = originalIdx;
  if (hasChanging) {
    changedIdx = 0;
    for (var i = 0; i < 6; i++) {
      var yang = isYang(hexagramLines[i].headsCount);
      if (isChanging(hexagramLines[i].headsCount)) yang = !yang;
      if (yang) changedIdx |= (1 << i);
    }
  }
  var changedGua = hasChanging ? HEXAGRAM_MAP[changedIdx] : null;

  var LINE_NAMES = ['初爻','二爻','三爻','四爻','五爻','上爻'];
  var changingList = [];
  for (var i = 0; i < 6; i++) {
    if (isChanging(hexagramLines[i].headsCount)) {
      var t = hexagramLines[i].headsCount === 3 ? '老阳 ⚊→⚋' : '老阴 ⚋→⚊';
      changingList.push(LINE_NAMES[i] + '（' + t + '）');
    }
  }

  var html = '<div class="gua-symbol">' + originalGua.s + '</div>';
  html += '<div class="gua-name">' + originalGua.n + '</div>';
  html += '<div class="gua-name" style="font-size:12px;color:#888">' + originalGua.p + '</div>';
  html += '<div class="gua-detail"><b>卦辞：</b>' + originalGua.g + '</div>';
  html += '<div class="gua-detail"><b>象曰：</b>' + originalGua.x + '</div>';
  if (hasChanging) {
    html += '<div class="changed-name">' + changedGua.s + ' 变卦：' + changedGua.n + '</div>';
    html += '<div class="gua-detail"><b>变卦辞：</b>' + changedGua.g + '</div>';
    html += '<div class="gua-detail" style="color:#ce2b37;margin-top:6px"><b>变爻：</b>' + changingList.join('、') + '</div>';
  }
  html += '<button class="btn-copy" id="copyBtn" style="margin-top:8px">复制结果</button>';
  elHexagramResult.innerHTML = html;

  // Build plain text for copy
  var plainText = originalGua.s + ' ' + originalGua.n + ' (' + originalGua.p + ')\n';
  plainText += '卦辞：' + originalGua.g + '\n';
  plainText += '象曰：' + originalGua.x + '\n';
  if (hasChanging) {
    plainText += '\n变卦：' + changedGua.s + ' ' + changedGua.n + '\n';
    plainText += '变卦辞：' + changedGua.g + '\n';
    plainText += '变爻：' + changingList.join('、') + '\n';
  }
  plainText += '\n—— 抛硬币卜卦 🪙';

  document.getElementById('copyBtn').onclick = function() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(plainText).then(function() {
        var btn = document.getElementById('copyBtn');
        btn.textContent = '已复制 ✓';
        setTimeout(function() { btn.textContent = '复制结果'; }, 2000);
      });
    }
  };

  elResultPanel.style.display = 'none';

  // Show LLM ask section and history
  showAskSection();
  renderHistory();

  // Build detailed LLM prompt text with line-by-line details
  llmPromptText = '占卜结果：\n';
  llmPromptText += '本卦：' + originalGua.s + ' ' + originalGua.n + ' (' + originalGua.p + ')\n';
  llmPromptText += '卦辞：' + originalGua.g + '\n';
  llmPromptText += '象曰：' + originalGua.x + '\n';
  llmPromptText += '\n六爻详情：\n';
  var LINE_NAMES2 = ['初爻','二爻','三爻','四爻','五爻','上爻'];
  var lineTypeNames = { laoyang: '老阳（⚊→⚋ 变爻）', shaoyin: '少阴（⚋ 不变）', shaoyang: '少阳（⚊ 不变）', laoyin: '老阴（⚋→⚊ 变爻）' };
  for (var i = 0; i < 6; i++) {
    var lt = hexagramLines[i].lineType;
    llmPromptText += LINE_NAMES2[i] + '：' + (lineTypeNames[lt] || lt) + '\n';
  }
  if (hasChanging) {
    llmPromptText += '\n变卦：' + changedGua.s + ' ' + changedGua.n + ' (' + changedGua.p + ')\n';
    llmPromptText += '变卦辞：' + changedGua.g + '\n';
    llmPromptText += '变爻：' + changingList.join('、') + '\n';
  }
}

function fetchLlmInterpretation(api, key, model, systemPrompt, userPrompt, callback) {
  var controller = new AbortController();
  var timeout = setTimeout(function() { controller.abort(); }, 30000);

  fetch(api, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key
    },
    body: JSON.stringify({
      model: model,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userPrompt }
      ],
      temperature: 0.7,
      max_tokens: 2000
    }),
    signal: controller.signal
  })
  .then(function(res) {
    clearTimeout(timeout);
    if (!res.ok) {
      return res.text().then(function(t) {
        var msg = 'HTTP ' + res.status;
        try {
          var j = JSON.parse(t);
          if (j.error && j.error.message) msg += ': ' + j.error.message;
        } catch(e) { msg += ': ' + t.slice(0, 200); }
        callback(msg, null);
      });
    }
    return res.json();
  })
  .then(function(data) {
    if (!data) return;
    if (data.choices && data.choices.length > 0 && data.choices[0].message) {
      callback(null, data.choices[0].message.content);
    } else {
      callback('API 返回格式异常', null);
    }
  })
  .catch(function(err) {
    clearTimeout(timeout);
    if (err.name === 'AbortError') {
      callback('请求超时（30秒），请检查网络或 API 地址', null);
    } else {
      callback('网络错误：' + err.message, null);
    }
  });
}

// ========== INTERPRETATION HISTORY ==========
function loadHistory() {
  try {
    var raw = localStorage.getItem(INTERP_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveInterpretation(question, hexagramText, interpretation) {
  var history = loadHistory();
  history.unshift({
    timestamp: Math.floor(Date.now() / 1000),
    question: question,
    hexagram_text: hexagramText,
    interpretation: interpretation
  });
  if (history.length > 3) history = history.slice(0, 3);
  try { localStorage.setItem(INTERP_STORAGE_KEY, JSON.stringify(history)); } catch(e) {}
}

function renderHistory() {
  var history = loadHistory();
  if (history.length === 0) {
    elHistorySection.classList.add('hidden');
    elHistorySection.classList.remove('complete');
    return;
  }
  elHistorySection.classList.remove('hidden');
  elHistorySection.classList.add('complete');
  elHistoryList.innerHTML = '';

  history.forEach(function(item, idx) {
    var dateStr = new Date(item.timestamp * 1000).toLocaleString('zh-CN');
    var el = document.createElement('div');
    el.className = 'history-item';
    el.innerHTML =
      '<span class="hi-time">' + dateStr + '</span>' +
      '<span class="hi-delete" data-idx="' + idx + '">删除</span>' +
      '<div class="hi-question">' + escapeHtml(item.question) + '</div>' +
      '<div class="hi-body">' + escapeHtml(item.interpretation) + '</div>';
    el.onclick = function(e) {
      if (e.target.classList.contains('hi-delete')) {
        e.stopPropagation();
        deleteHistoryItem(parseInt(e.target.getAttribute('data-idx')));
        return;
      }
      el.classList.toggle('expanded');
    };
    elHistoryList.appendChild(el);
  });
}

function deleteHistoryItem(idx) {
  var history = loadHistory();
  if (idx >= 0 && idx < history.length) {
    history.splice(idx, 1);
    try { localStorage.setItem(INTERP_STORAGE_KEY, JSON.stringify(history)); } catch(e) {}
    renderHistory();
  }
}

elHistoryToggle.onclick = function() {
  elHistoryToggle.classList.toggle('open');
  elHistoryList.classList.toggle('show');
};

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

    elResultPanel.style.transform = 'translateX(-50%)';
  }

  if (mode === 'hexagram') {
    createCoins(3);
    updateHexagramProgress();
    elProgressText.textContent = '第 0 / 6 次';
  } else if (mode === 'triple') {
    createCoins(3);
    elProgressText.textContent = '';
  } else {
    createCoins(1);
    elProgressText.textContent = '';
  }
}

elFlipBtn.addEventListener('click', triggerFlip);

// ========== GYROSCOPE / DEVICE MOTION ==========
var SHAKE_RATIO = 1.55;
var COOLDOWN_MS = 1500;
var SETTLE_FRAMES = 20;

var restingMag = 0;
var lpAlpha = 0.05;
var gyroArmed = true;
var settleCounter = 0;
var sensorCheckDone = false;

function tryRegisterMotionListener() {
  gyroActive = true;
  elDbGyro.textContent = 'listn';
  elDbGyro.className = 'warn';
  window.addEventListener('devicemotion', handleDeviceMotion);
  window.addEventListener('deviceorientation', handleDeviceOrientation);

  setTimeout(function() {
    if (!sensorCheckDone && debugEvCount === 0 && debugOrCount === 0) {
      elDbGyro.textContent = 'NO EV';
      elDbGyro.className = 'warn';
      elDbMag.textContent = 'HTTP?';
    }
  }, 3000);
}

function handleDeviceMotion(e) {
  if (!gyroActive) return;

  var raw = e.accelerationIncludingGravity;
  if (!raw || raw.x === null) return;

  var mag = Math.sqrt(raw.x * raw.x + raw.y * raw.y + raw.z * raw.z);
  if (mag <= 0) return;

  debugEvCount++;
  sensorCheckDone = true;

  // Capture linear acceleration for coin launch direction
  shakeAccX = raw.x;
  shakeAccY = raw.y;
  shakeAccZ = raw.z;

  // Capture rotation rate (deg/s) for coin angular velocity
  if (e.rotationRate) {
    shakeRotX = (e.rotationRate.beta  || 0) * (Math.PI / 180);
    shakeRotY = (e.rotationRate.alpha || 0) * (Math.PI / 180);
    shakeRotZ = (e.rotationRate.gamma || 0) * (Math.PI / 180);
  }

  if (restingMag === 0) {
    restingMag = mag;
  } else {
    restingMag += lpAlpha * (mag - restingMag);
  }

  var ratio = mag / Math.max(restingMag, 0.1);

  if (debugEvCount % 8 === 0) {
    elDbGyro.textContent = 'OK';
    elDbGyro.className = 'ok';
    elDbMag.textContent = mag.toFixed(2);
    elDbRest.textContent = restingMag.toFixed(2);
    elDbRatio.textContent = ratio.toFixed(3);
    elDbEv.textContent = '' + debugEvCount;
  }

  if (!cooldown && gyroArmed && ratio > SHAKE_RATIO) {
    triggerFlip();
    gyroArmed = false;
    settleCounter = 0;
  }
}

var debugOrCount = 0;

function handleDeviceOrientation(e) {
  if (!gyroActive) return;
  debugOrCount++;
  sensorCheckDone = true;
  if (debugOrCount === 5 && debugEvCount === 0) {
    elDbGyro.textContent = 'orOnly';
    elDbGyro.className = 'warn';
  }
}

function updateGyroArmState() {
  if (gyroArmed) return;
  if (cooldown) {
    settleCounter = 0;
    return;
  }
  settleCounter++;
  if (settleCounter >= SETTLE_FRAMES) {
    gyroArmed = true;
    settleCounter = 0;
  }
}

function requestGyroPermission() {
  isDesktop = !('ontouchstart' in window) && !navigator.maxTouchPoints;

  if (isDesktop) {
    elGyroBadge.style.display = 'none';
    gyroPermission = 'desktop';
    elDbGyro.textContent = 'PC';
    elDbGyro.className = 'warn';
    return;
  }

  var DME = window.DeviceMotionEvent;
  if (!DME) { try { DME = DeviceMotionEvent; } catch(e) {} }
  var needPermission = !!(DME && DME.requestPermission);

  if (needPermission) {
    elPermPrompt.classList.remove('hidden');
    elPermBtn.classList.remove('hidden');
    elPermRetryBtn.classList.add('hidden');
    elPermIcon.textContent = '\u{1F4F1}';
    elPermText.innerHTML = '\u9700\u8981\u9640\u8776\u4eea\u6743\u9650\u6765\u68c0\u6d4b<br>\u624b\u673a\u7684\u629b\u63b7\u52a8\u4f5c';
    elPermBtn.textContent = '\u542f\u7528\u9640\u8776\u4eea';
    elGyroBadge.classList.add('denied');
    elDbGyro.textContent = 'prompt';
    elDbGyro.className = 'warn';

    elPermBtn.onclick = function() {
      DME.requestPermission()
        .then(function(state) {
          if (state === 'granted') {
            elGyroBadge.classList.add('active');
            elGyroBadge.classList.remove('denied');
            elPermPrompt.classList.add('hidden');
            tryRegisterMotionListener();
          } else {
            gyroPermission = 'denied';
            showPermissionDenied();
          }
        })
        .catch(function() {
          gyroPermission = 'denied';
          showPermissionDenied();
        });
    };

    elPermRetryBtn.onclick = function() {
      DME.requestPermission()
        .then(function(state) {
          if (state === 'granted') {
            elGyroBadge.classList.add('active');
            elGyroBadge.classList.remove('denied');
            elPermPrompt.classList.add('hidden');
            tryRegisterMotionListener();
          }
        })
        .catch(function() {});
    };
  } else {
    elGyroBadge.classList.add('active');
    tryRegisterMotionListener();
  }
}

function showPermissionDenied() {
  elGyroBadge.classList.add('denied');
  elPermPrompt.classList.remove('hidden');
  elPermBtn.classList.add('hidden');
  elPermRetryBtn.classList.remove('hidden');
  elPermIcon.textContent = '\u26A0\uFE0F';
  elPermText.innerHTML = '\u6743\u9650\u5df2\u88ab\u62d2\u7edd\uff0c\u8bf7\u5728\u7cfb\u7edf\u8bbe\u7f6e\u4e2d<br>\u5141\u8bb8\u8fd0\u52a8\u4f20\u611f\u5668\u6743\u9650';
}


// ========== RESIZE ==========
window.addEventListener('resize', function() {
  var rect = elCanvasWrap.getBoundingClientRect();
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
  renderer.setSize(rect.width, rect.height, false);
});

// ========== CAMERA TRACKING ==========
function updateCamera() {
  if (coins.length === 0) return;

  // Compute centroid of all coins (XZ for look-at, Y for height)
  var cx = 0, cy = 0, cz = 0;
  coins.forEach(function(c) {
    cx += c.mesh.position.x;
    cy += c.mesh.position.y;
    cz += c.mesh.position.z;
  });
  cx /= coins.length;
  cy /= coins.length;
  cz /= coins.length;

  // Compute max horizontal spread from centroid
  var maxDist = 0;
  coins.forEach(function(c) {
    var dx = c.mesh.position.x - cx;
    var dz = c.mesh.position.z - cz;
    var d2 = dx * dx + dz * dz;
    if (d2 > maxDist) maxDist = d2;
  });
  var spread = Math.sqrt(maxDist);

  // Target look-at: centroid, but at table surface level
  var targetLook = new THREE.Vector3(cx, TABLE_Y, cz);

  // Target camera position: above & behind centroid,
  // pull back further when coins are spread out
  var baseZ = 18;
  var baseY = 30;
  var tz = baseZ + spread * 2.2;
  var ty = baseY + spread * 1.2;
  var targetPos = new THREE.Vector3(cx, cy + ty, cz + tz);

  // Clamp: don't go below table level
  if (targetPos.y < TABLE_Y + 1) targetPos.y = TABLE_Y + 1;

  // Smoothly lerp camera position and look-at target
  var smooth = 0.04;
  camTargetLook.lerp(targetLook, smooth);
  camTargetPos.lerp(targetPos, smooth);

  camera.position.copy(camTargetPos);
  camera.lookAt(camTargetLook);
}

// ========== RENDER LOOP ==========
var lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  var now = performance.now();
  var dt = (now - lastTime) / 1000;
  lastTime = now;
  stepPhysics(dt);
  updateGyroArmState();
  updateCamera();

  renderer.render(scene, camera);
}

setMode('hexagram');
animate();

// ========== WAKE LOCK (prevent screen sleep) ==========
var wakeLock = null;
function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    navigator.wakeLock.request('screen').then(function(lock) {
      wakeLock = lock;
      wakeLock.addEventListener('release', function() {
        wakeLock = null;
      });
    }).catch(function() {});
  } catch(e) {}
}
// Request on first user interaction
document.addEventListener('click', function once() {
  requestWakeLock();
}, { once: true });
// Re-acquire when tab becomes visible again
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && !wakeLock) {
    requestWakeLock();
  }
});
</script>
