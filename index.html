<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>意大利面·42号混凝土</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#1c1c1e;color:#e4e4e6;min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:center;padding:20px;
}
.app{width:100%;max-width:420px;text-align:center}

.header{margin-bottom:32px}
.header .icon{font-size:48px;margin-bottom:8px;letter-spacing:4px}
.header h1{font-size:22px;font-weight:700;line-height:1.4}
.header h1 .green{color:#009246}
.header h1 .red{color:#ce2b37}
.header .sub{font-size:13px;color:#666;margin-top:6px;letter-spacing:3px}
.header .divider{width:60px;height:3px;background:linear-gradient(90deg,#009246,#fff,#ce2b37);margin:16px auto 0;border-radius:2px}

.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.tool-card{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;background:#252528;border:1.5px solid #333;
  border-radius:14px;text-decoration:none;color:#e4e4e6;
  transition:all .2s;text-align:left
}
.tool-card:hover{border-color:#555;background:#2a2a2d}
.tool-card:active{transform:scale(.98)}
.tool-card .emoji{font-size:28px;flex-shrink:0}
.tool-card .info{flex:1;min-width:0}
.tool-card .info .name{font-size:15px;font-weight:700;margin-bottom:2px}
.tool-card .info .desc{font-size:12px;color:#888;line-height:1.4}
.tool-card .arrow{color:#555;font-size:18px;flex-shrink:0}

.footer{font-size:11px;color:#444;line-height:1.6}
.footer a{color:#555;text-decoration:none}
.footer a:hover{color:#888}

@media(max-width:360px){
  .header .icon{font-size:40px}
  .header h1{font-size:19px}
  .tool-card{padding:14px}
  .tool-card .emoji{font-size:24px}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="icon">🏗️</div>
    <h1>
      <span class="green">意大利面</span>
      <span>·</span>
      <span class="red">42号混凝土</span>
    </h1>
    <div class="sub">知 识 搅 拌 机</div>
    <div class="divider"></div>
  </div>

  <div class="tools">
    <a class="tool-card" href="encryptor/index.html">
      <span class="emoji">🔐</span>
      <span class="info">
        <div class="name">加密解密工具</div>
        <div class="desc">以原文段为码本，将任意文本转译为搅拌机风格文案，支持自主管理令牌</div>
      </span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="footer">
    <a href="https://github.com/anomalyco/opencode">opencode</a> ·
    更多工具开发中
  </div>

</div>
</body>
</html>
